# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: build
on: [push]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        # Only install the root workspace dependencies (oxfmt)
        run: bun install --frozen-lockfile --filter workbench
      - name: Check formatting
        run: bun run fmt:check

  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.web.outputs.web }}
      apps: ${{ steps.apps.outputs.changes }}
      templates: ${{ steps.templates.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Filter web
        uses: dorny/paths-filter@v4
        id: web
        with:
          filters: |
            web:
              - bun.lock
              - package.json
              - README.md
              - web/**
              - content/**
      - name: Filter apps
        # Add a filter key here for each new app under apps/
        uses: dorny/paths-filter@v4
        id: apps
        with:
          filters: |
            recipes:
              - bun.lock
              - package.json
              - apps/recipes/**
      - name: Filter templates
        # Add a filter key here for each new template under templates/
        uses: dorny/paths-filter@v4
        id: templates
        with:
          filters: |
            tss:
              - bun.lock
              - package.json
              - templates/tss/**

  build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --filter "./web"
      - name: Run tests
        working-directory: web
        run: bun test --pass-with-no-tests
      - name: Build project
        working-directory: web
        run: bun run build

  build-apps:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.changes.outputs.apps) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --filter "./apps/${{ matrix.app }}"
      - name: Run tests
        working-directory: apps/${{ matrix.app }}
        run: bun test --pass-with-no-tests
      - name: Build project
        working-directory: apps/${{ matrix.app }}
        run: bun run build

  build-templates:
    needs: changes
    if: needs.changes.outputs.templates != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: ${{ fromJson(needs.changes.outputs.templates) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --filter "./templates/${{ matrix.template }}"
      - name: Build template
        working-directory: templates/${{ matrix.template }}
        run: bun run build
