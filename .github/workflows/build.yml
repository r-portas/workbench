# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: build
on: [push]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        # Only install the root workspace dependencies (oxfmt)
        run: bun install --frozen-lockfile --filter workbench
      - name: Check formatting
        run: bun run fmt:check

  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Filter packages
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - bun.lock
              - package.json
              - README.md
              - web/**
              - content/**
            recipes:
              - bun.lock
              - package.json
              - apps/recipes/**
            tss:
              - bun.lock
              - package.json
              - templates/tss/**

  build:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.changes.outputs.packages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --filter ${{ matrix.package }}
      - name: Run tests
        run: bun run --filter ${{ matrix.package }} test
      - name: Build project
        run: bun run --filter ${{ matrix.package }} build
